# Static SPA server for the frontend image (behind the edge nginx).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # History-API fallback: deep links like /boards/:id return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
