name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Fast gate: formatting, static analysis, types and unit tests (no services).
  quality:
    name: Quality (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Integration (supertest on a real DB) plus Playwright against the full stack.
  e2e:
    name: E2E (integration + Playwright)
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/min_trello
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/min_trello_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-for-tests-only
      CORS_ORIGIN: http://localhost:5174
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: min_trello
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build packages
        run: pnpm build

      - name: Create test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres min_trello_test

      - name: Apply migrations to test database
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: pnpm exec prisma migrate deploy

      - name: Backend integration tests
        run: pnpm --filter @min-trello/backend test:e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm --filter @min-trello/frontend exec playwright install --with-deps chromium

      - name: Playwright e2e tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # Make sure both production images still build on every change.
  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
